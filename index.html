<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starbound 百科 · 物品与星球图鉴</title>
<style>
:root{
  --bg:#f2f4f7; --bg2:#e9ecf1; --card:#ffffff; --line:#e2e6ec; --line2:#eef1f5;
  --txt:#171a20; --txt2:#4a5260; --mut:#8b93a3;
  --accent:#d97428; --accent-soft:#fdf1e5; --blue:#2f6fd0; --blue-soft:#eaf1fd;
  --green:#2f8f4e; --green-soft:#e9f6ed; --purple:#7c4dbe; --purple-soft:#f2ecfb;
  --r-common:#5d6673; --r-uncommon:#1b7a33; --r-rare:#1f5bb5;
  --r-legendary:#7f2fc7; --r-essential:#bd6710;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px -8px rgba(16,24,40,.12);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0d1014; --bg2:#13171d; --card:#161b22; --line:#242b35; --line2:#1d232b;
  --txt:#e7eaf0; --txt2:#adb6c4; --mut:#78818f;
  --accent:#f0913f; --accent-soft:#2a1d10; --blue:#6aa6f0; --blue-soft:#152233;
  --green:#5fbf7f; --green-soft:#12251a; --purple:#a989e0; --purple-soft:#1d1730;
  --r-common:#8f98a8; --r-uncommon:#4cc76a; --r-rare:#5b9bf0;
  --r-legendary:#b98ce8; --r-essential:#f0a04b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit}
::selection{background:var(--accent);color:#fff}

/* ---------------- header ---------------- */
header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1360px;margin:0 auto;padding:12px 22px 8px}
.brandline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(145deg,#f7a34a,#d1552b);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 2px 8px rgba(209,85,43,.35);
}
h1{font-size:16.5px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
h1 small{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:8px;letter-spacing:0}
.brandline .spacer{flex:1}
.iconbtn{
  background:var(--card);border:1px solid var(--line);color:var(--txt2);
  width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:0 0 auto;
}
.iconbtn:hover{background:var(--bg2);color:var(--txt)}
.iconbtn svg{width:17px;height:17px}

.searchrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.searchbox{
  position:relative;flex:1;min-width:0;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);transition:.15s;
}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.searchbox svg{width:18px;height:18px;margin-left:13px;color:var(--mut);flex:0 0 auto}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--txt);padding:10px;font-size:15px}
#q::placeholder{color:var(--mut)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#clear{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:4px 12px;font-size:18px;line-height:1;display:none}
#clear:hover{color:var(--txt)}
select{
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer;outline:0;min-width:0;
}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px;flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--mut);padding:6px 13px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}

/* ---------------- 筛选栏 ---------------- */
.filterrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center;position:relative}
.fwrap{position:relative}
.fbtn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;
  color:var(--txt2);transition:.15s;white-space:nowrap;
}
.fbtn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--txt)}
.fbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.fbtn .n{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:16px;font-weight:700}
.fbtn .car{opacity:.5;font-size:9px}
.fbtn.hide{display:none}
.clearall{
  border:0;background:transparent;color:var(--mut);font-size:12.5px;cursor:pointer;padding:6px 4px;
  text-decoration:underline dotted;
}
.clearall:hover{color:var(--accent)}

.pop{
  position:absolute;top:calc(100% + 7px);left:0;z-index:70;width:330px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 24px 60px -24px rgba(9,14,22,.45),0 2px 8px rgba(9,14,22,.08);
  display:none;flex-direction:column;overflow:hidden;
}
.pop.on{display:flex}
.pop .ph{padding:8px;border-bottom:1px solid var(--line2)}
.pop input{
  width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--txt);
  border-radius:8px;padding:7px 10px;font-size:13px;outline:0;
}
.pop input:focus{border-color:var(--accent)}
.pop .plist{overflow-y:auto;max-height:min(52vh,380px);padding:6px}
.opt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.opt:hover{background:var(--bg2)}
.opt input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.opt .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .c{color:var(--mut);font-size:11.5px;flex:0 0 auto}
.opt .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1.5px rgba(15,20,28,.22)}
.pop .pf{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line2);font-size:12px;color:var(--mut)}
.pop .pf button{border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
.pop .pf button:hover{border-color:var(--accent);color:var(--accent)}

.activechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.achip{
  display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;
  padding:2px 9px;font-size:12px;cursor:pointer;
}
.achip:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}

/* ---------------- toolbar ---------------- */
.toolbar{max-width:1360px;margin:0 auto;padding:12px 22px 2px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.count{color:var(--txt2);font-size:13px}
.count b{color:var(--accent);font-weight:700}
.hint{color:var(--mut);font-size:12px;margin-left:auto}
.hidtip{color:var(--mut);font-size:12px;margin-left:8px}
.hint kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--txt2)}

/* ---------------- 页面切换 / 星球 ---------------- */
[hidden]{display:none!important}
.pagebar{display:flex;gap:4px;margin-top:10px;background:var(--bg2);padding:3px;border-radius:11px;width:fit-content}
.pagebar button{border:0;background:transparent;color:var(--txt2);padding:6px 15px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
.pagebar button:hover{color:var(--txt)}
.pagebar button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#pview{max-width:1360px;margin:0 auto;padding:14px 22px 40px}
.pfilter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pfilter input{
  width:280px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:10px;padding:8px 12px;font-size:13px;outline:0;
}
.pfilter input:focus{border-color:var(--accent)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:9px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:.15s}
.pchip:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.pchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pcount{color:var(--mut);font-size:12.5px;margin-left:auto}
.pchip .tc{opacity:.55;font-size:11px}
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 15px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .13s,border-color .13s,box-shadow .13s;
  display:flex;gap:13px;align-items:flex-start}
.pthumb{width:48px;height:48px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bg2) 70%,#fff),var(--bg2));
  border:1px solid var(--line2);overflow:hidden}
.pthumb img{width:38px;height:38px;image-rendering:pixelated;object-fit:contain}
.pthumb .pball{width:32px;height:32px;font-size:14px}
.pwrap{flex:1;min-width:0}
.mchar{width:100%;height:100%;display:grid;place-items:center;font-weight:700;font-size:18px;border-radius:50%}
.mhp{color:var(--green);font-weight:700}
.dhead .ico img{width:42px;height:42px;object-fit:contain}
.pcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 10px 26px -14px rgba(16,24,40,.35)}
.phd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phd h3{margin:0;font-size:15.5px;font-weight:700}
.thr{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt2);white-space:nowrap}
.thr[data-t="1"],.pball[data-t="1"]{--tc:#2f8f4e}
.thr[data-t="2"],.pball[data-t="2"]{--tc:#4a9a2e}
.thr[data-t="3"],.pball[data-t="3"]{--tc:#a8871a}
.thr[data-t="4"],.pball[data-t="4"]{--tc:#c06a12}
.thr[data-t="5"],.pball[data-t="5"]{--tc:#c04a20}
.thr[data-t="6"],.pball[data-t="6"]{--tc:#b8322b}
.thr[data-t]{color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);
  border-color:color-mix(in srgb,var(--tc) 32%,transparent)}
html[data-theme="dark"] .thr[data-t="1"],.pball[data-t="1"]{--tc:#5fbf7f}
html[data-theme="dark"] .thr[data-t="2"],.pball[data-t="2"]{--tc:#7cc45a}
html[data-theme="dark"] .thr[data-t="3"],.pball[data-t="3"]{--tc:#d9b64a}
html[data-theme="dark"] .thr[data-t="4"],.pball[data-t="4"]{--tc:#ed9a52}
html[data-theme="dark"] .thr[data-t="5"],.pball[data-t="5"]{--tc:#ef8262}
html[data-theme="dark"] .thr[data-t="6"],.pball[data-t="6"]{--tc:#ef6f68}
.psrc{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--bg2);color:var(--mut);border:1px solid var(--line2)}
.pbi{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.55}
.pls{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.plb{font-size:11px;color:var(--mut);flex:0 0 34px}
.och{display:inline-flex;align-items:baseline;gap:4px;font-size:12.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;color:var(--txt2)}
.och i{font-style:normal;font-size:10.5px;color:var(--mut)}
.och.hi{border-color:color-mix(in srgb,var(--accent) 40%,var(--line2));background:var(--accent-soft);color:var(--accent)}
.och.hi i{color:color-mix(in srgb,var(--accent) 70%,var(--mut))}
.morep{display:block;width:100%;margin:16px 0 0;padding:11px;border:1px dashed var(--line);background:var(--card);
  color:var(--txt2);border-radius:12px;cursor:pointer;font-size:13px}
.morep:hover{border-color:var(--accent);color:var(--accent)}
.pgo{display:block;margin-top:9px;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.pstats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pst{font-size:12px;color:var(--txt2);background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:1.5px 7px}
.pst b{color:var(--accent);font-weight:700;margin-right:2px}
.pst.env{color:#c06a12;background:#fdf1e3;border-color:#f0d6b6}
html[data-theme="dark"] .pst.env{color:#ed9a52;background:#2a1d10;border-color:#4a3320}
.pbl .bchip i{font-style:normal;color:var(--mut);font-size:10.5px;margin-left:4px}
.envline{display:flex;gap:8px;flex-wrap:wrap}
.etag{font-size:13px;border-radius:8px;padding:4px 12px;background:var(--accent-soft);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.etag i{font-style:normal;opacity:.72;margin-left:5px;font-size:11.5px}
#dbody .psec{margin-bottom:22px}
#dbody .psec h4{margin-bottom:10px}
.pmor{border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px}
.pmor:hover{background:var(--accent-soft)}
.pfoot{font-size:11.5px;color:var(--mut);line-height:1.7;border-top:1px solid var(--line2);padding-top:11px;margin-top:4px}
.lvbar{display:flex;gap:7px;flex-wrap:wrap}
.lvb{border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:8px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:6px}
.lvb:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.lvb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.lvb i{font-style:normal;font-size:11px;opacity:.62}
.lvn{font-size:11.5px;color:var(--mut);margin-top:9px;line-height:1.6}
.mgroup+.mgroup{margin-top:13px}
.mghead{font-size:11.5px;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.mghead:before{content:'';width:2px;height:11px;border-radius:1px;background:var(--line)}
.mgroup:first-child .mghead:before{background:var(--accent)}
.mghead em{font-style:normal;opacity:.7}
.och[data-r]{border-color:color-mix(in srgb,var(--rc) 45%,var(--line2));
  background:color-mix(in srgb,var(--rc) 9%,var(--bg2));color:color-mix(in srgb,var(--rc) 78%,var(--txt))}
.rarleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--mut)}
.rarleg span{display:inline-flex;align-items:center;gap:5px}
.rarleg span:before{content:'';width:9px;height:9px;border-radius:2.5px;background:var(--rc);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 35%,transparent)}
.pcard:hover .pgo{color:var(--accent)}
.pmn{font-size:11px;color:var(--mut)}
.pnone{font-size:12px;color:var(--mut)}
/* 弹窗内 */
.pball{--tc:#8b93a3;width:100%;height:100%;display:grid;place-items:center;border-radius:50%;
  font-weight:800;font-size:21px;color:#fff;letter-spacing:-.5px;
  background:radial-gradient(circle at 34% 26%,color-mix(in srgb,var(--tc) 45%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 65%,#000))}
.pbl{display:flex;flex-wrap:wrap;gap:7px}
.bchip{font-size:12.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;color:var(--txt2)}
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ptbl th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;padding:0 0 6px;border-bottom:1px solid var(--line2)}
.ptbl td{padding:11px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.ptbl tr:last-child td{border-bottom:0}
.ptbl .pg{color:var(--txt2);font-weight:600;white-space:nowrap}
.pch{display:flex;flex-wrap:wrap;gap:7px}
.pnote{font-size:11.5px;color:var(--mut);margin-top:9px;line-height:1.6}

/* ---------------- cards ---------------- */
main{max-width:1360px;margin:0 auto;padding:8px 22px 40px}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .13s, box-shadow .13s, border-color .13s;
  display:flex;gap:11px;position:relative;
}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 10px 26px -14px rgba(16,24,40,.35)}
/* 稀有度束带：卡片左侧同色竖条 */
.card[data-r]{padding-left:16px}
.card[data-r]::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:4px;
  background:var(--rc);border-radius:0 3px 3px 0;
  box-shadow:0 0 7px -2px color-mix(in srgb,var(--rc) 65%,transparent);
  transition:opacity .15s;
}
.card[data-r]:hover::before{opacity:.82}
.ico{width:44px;height:44px;flex:0 0 auto;border-radius:10px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;border:1.5px solid var(--rc,var(--line2));transition:border-color .15s,background .15s}
/* 稀有度方框：颜色变量由 data-r 提供，未标注稀有度的物品沿用默认灰线 */
[data-r="common"]{--rc:var(--r-common)}
[data-r="uncommon"]{--rc:var(--r-uncommon)}
[data-r="rare"]{--rc:var(--r-rare)}
[data-r="legendary"]{--rc:var(--r-legendary)}
[data-r="essential"]{--rc:var(--r-essential)}
.ico[data-r]{
  background:color-mix(in srgb,var(--rc) 11%,var(--bg2));
  /* 外圈：同色加深的实心描边 */
  box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 58%,#0b0f14);
}
.ico[data-r="legendary"],.ico[data-r="essential"]{
  box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 58%,#0b0f14),
             0 0 0 4.5px color-mix(in srgb,var(--rc) 15%,transparent);
}
html[data-theme="dark"] .ico[data-r]{box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 40%,#000)}
html[data-theme="dark"] .ico[data-r="legendary"],html[data-theme="dark"] .ico[data-r="essential"]{
  box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 40%,#000),
             0 0 0 4.5px color-mix(in srgb,var(--rc) 14%,transparent);
}
.ico img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.ico .ph{font-size:14px;font-weight:700}
.body{flex:1;min-width:0}
.title{display:flex;align-items:baseline;gap:7px}
.title h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{font-size:11.5px;color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:6px;padding:1px 6px;flex:0 0 auto}
.sub{color:var(--mut);font-size:11.5px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ings{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ing{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:2px 7px 2px 3px;font-size:12px;color:var(--txt2);transition:.12s}
.ing:hover{border-color:var(--accent);color:var(--accent)}
.ing img{width:17px;height:17px;image-rendering:pixelated;object-fit:contain}
.ing .ph{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700}
.ing em{font-style:normal;color:var(--mut);font-size:11px;font-weight:600}
.ing .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--bg2);color:var(--mut);border:1px solid var(--line2)}
.tag.src{color:var(--blue);background:var(--blue-soft);border-color:transparent}

/* 物品模式 */
.abadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ab{font-size:10.5px;padding:1px 7px;border-radius:6px;border:1px solid transparent;font-weight:600}
.ab.t0{color:var(--blue);background:var(--blue-soft)}
.ab.t1{color:var(--green);background:var(--green-soft)}
.ab.t2{color:var(--accent);background:var(--accent-soft)}
.ab.t3{color:var(--purple);background:var(--purple-soft)}
.ab.t4{color:#8a7a2f;background:#f7f3df}

/* 表格视图 */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--mut);letter-spacing:.4px;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--bg2)}
.tbl .pname{display:flex;align-items:center;gap:9px;min-width:0}
.tbl .pname img{width:23px;height:23px;image-rendering:pixelated;flex:0 0 auto}
.tbl .pname img[data-r]{border-radius:5px;background:color-mix(in srgb,var(--rc) 13%,transparent);outline:1.5px solid var(--rc);outline-offset:-1.5px}
.tbl .pname span{font-weight:600}
.tbl .pings{display:flex;flex-wrap:wrap;gap:4px}
.tbl .pstation{color:var(--mut);font-size:12px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tbl .pq{color:var(--accent);font-weight:700}

mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:70px 20px;color:var(--mut)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
#morewrap{text-align:center;padding:16px 0 0}
#more{border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:10px;padding:9px 22px;cursor:pointer;font-size:13px;box-shadow:var(--shadow)}
#more:hover{border-color:var(--accent);color:var(--accent)}

/* ---------------- 抽屉 ---------------- */
#backdrop{position:fixed;inset:0;background:rgba(12,16,22,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#backdrop.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;height:100%;width:min(540px,100%);z-index:50;
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5);
}
#drawer.on{transform:none}
.dhead{padding:16px 20px 13px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:flex-start}
.dhead .ico{width:58px;height:58px;border-radius:12px}
.dhead h2{margin:0;font-size:17.5px;font-weight:700;line-height:1.3;padding-right:26px}
.dhead .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--mut);margin-top:2px;word-break:break-all}
.badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--bg2);color:var(--txt2);border:1px solid var(--line2)}
.badge.r-common{color:var(--r-common)}
.badge.r-uncommon{color:var(--r-uncommon)}
.badge.r-rare{color:var(--r-rare)}
.badge.r-legendary{color:var(--r-legendary)}
.badge.r-essential{color:var(--r-essential)}
#dclose{position:absolute;top:13px;right:13px}
.dbody{overflow-y:auto;padding:14px 20px 40px;flex:1}
.dsec{margin-bottom:20px}
.dsec h4{margin:0 0 8px;font-size:12px;letter-spacing:.6px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.dsec h4:after{content:"";flex:1;height:1px;background:var(--line2)}
.desc{color:var(--txt2);font-size:13px;line-height:1.7}
.recipe{border:1px solid var(--line2);border-radius:11px;padding:10px 11px;margin-bottom:7px;background:var(--bg2)}
.recipe .top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.recipe .top .st{font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.recipe .top .file{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--mut);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uses{display:flex;flex-direction:column;gap:1px}
.use{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:9px;cursor:pointer}
.use:hover{background:var(--bg2)}
.use img{width:24px;height:24px;image-rendering:pixelated;flex:0 0 auto}
.use .ph{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.use .t{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.use .c{color:var(--mut);font-size:12px;flex:0 0 auto}
.none{color:var(--mut);font-size:12.5px;padding:8px 0}
.acq{display:flex;flex-direction:column;gap:6px}
.acrow{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.acrow .k{flex:0 0 auto;font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600;margin-top:1px}
.acrow .v{flex:1;min-width:0;color:var(--txt2);line-height:1.5}
.acrow .v b{font-weight:600;color:var(--txt)}
.more-btn{border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:2px 0}

footer{max-width:1360px;margin:0 auto;padding:0 22px 34px;color:var(--mut);font-size:11.5px;line-height:1.8}
footer b{color:var(--txt2);font-weight:600}

@media(max-width:700px){
  header{position:static;backdrop-filter:none}
  .hwrap,.toolbar,main,footer{padding-left:13px;padding-right:13px}
  h1{font-size:15px} h1 small{display:none}
  .searchrow{flex-wrap:wrap}
  .searchbox{flex:1 1 100%}
  #mode{flex:1 1 auto;justify-content:center}
  #sort{flex:1 1 0}
  #viewseg{flex:0 0 auto}
  .grid{grid-template-columns:1fr}
  .hint{display:none}
  .pop{position:fixed;left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:70vh}
  .tbl .pstation{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brandline">
      <div class="logo">SB</div>
      <h1>Starbound 百科<small id="srcline">物品 · 配方 · 星球 · 怪物</small></h1>
      <div class="spacer"></div>
      <button class="iconbtn" id="theme" title="切换深色/浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>

    <div class="pagebar" id="pagebar">
      <button data-p="items" class="on">物品 / 配方</button>
      <button data-p="planets">星球百科</button>
      <button data-p="monsters">怪物图鉴</button>
    </div>

    <div class="searchrow">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索物品 / 材料 / 拼音 / ID">
        <button id="clear" title="清空">×</button>
      </div>
      <div class="seg" id="mode">
        <button data-m="recipe" class="on">配方</button>
        <button data-m="item">物品</button>
      </div>
      <select id="sort" title="排序">
        <option value="name">按名称</option>
        <option value="station">按制作站</option>
        <option value="ings">按材料种类</option>
        <option value="count">按材料总量</option>
      </select>
    </div>

    <div class="filterrow" id="filters"></div>
    <div class="activechips" id="active"></div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <span class="count" id="count"></span>
  <div class="seg" id="viewseg">
    <button data-v="card" class="on">卡片</button>
    <button data-v="table">表格</button>
  </div>
  <span class="hint">空格分隔多关键词 · <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭 · 点击材料可反查</span>
</div>

<main id="mview" hidden>
  <div class="pfilter">
    <input id="mq" type="search" autocomplete="off" placeholder="搜索怪物名 / ID">
    <div class="pchips" id="mtabs"></div>
    <span class="pcount" id="mcount"></span>
  </div>
  <div class="pgrid" id="mgrid"></div>
</main>

<main id="pview" hidden>
  <div class="pfilter">
    <input id="pq" type="search" autocomplete="off" placeholder="搜索星球类型 / 矿物 / 群系">
    <div class="pchips" id="ptabs"></div>
    <span class="pcount" id="pcount"></span>
  </div>
  <div class="pgrid" id="pgrid"></div>
</main>

<main id="lview">
  <div id="list" class="grid"></div>
  <div id="morewrap"></div>
</main>

<footer id="foot"></footer>

<div id="backdrop"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead">
    <div class="ico" id="di"></div>
    <div style="flex:1;min-width:0">
      <h2 id="dn"></h2>
      <div class="id" id="did"></div>
      <div class="badges" id="db"></div>
    </div>
    <button class="iconbtn" id="dclose" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<link rel="preload" as="script" href="data/icons.js">
<script src="data/core.js"></script>
<script src="data/recipes.js"></script>
<script>
(function(){
"use strict";
const _el = document.getElementById('DATA');
const D = window.SB || JSON.parse(_el ? _el.textContent : '{}');
const IT = D.items || [], R = D.recipes || [], ST = D.stations || [], CA = D.cats || [], SR = D.srcs || [];
let IC = D.icons || [], PIC = D.pIcons || [];          // 拆分版稍后到达
let PL = D.planets || [], MON = D.monsters || [];       // 同上
const THR_NAME=['无害','低危','中等','高风险','危险','极端','致命','不可能','无法估量','免谈'];
const MCAT={walkers:'步行',flyers:'飞行',critter:'小动物',bugs:'虫类',crawlers:'爬行',
  segmented:'多节',boss:'头目',pets:'宠物',fish:'鱼类',fishing:'鱼类',space:'太空',
  ghosts:'幽灵',bees:'蜜蜂',mechdrone:'机兵',monsters:'常规',dungeon:'地牢',
  generated:'生成',unique:'独特',miscellaneous:'杂项',arcana_monsters:'奥法',
  arcana_misc:'奥法',mission:'任务',farming:'农场',unsorted:'未分类'};
const IX={}; IT.forEach((x,i)=>{ IX[x[0]]=i; });
const RS = D.research || [];
const OS = D.oreSrc || [];
const ACQ = D.acq, ACL = D.acqLabels;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ihash(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))|0;return Math.abs(h);}
const PALETTE=['#d97428','#2f6fd0','#2f8f4e','#7c4dbe','#c2410c','#0d9488','#b45309','#4f46e5'];
const RAR={common:'普通',uncommon:'罕见',rare:'稀有',legendary:'传说',essential:'必需'};
const rarOf=i=>{const it=IT[i];if(!it)return '';const r=String(it[6]||'').toLowerCase();return RAR[r]?r:'';};
const ACQ_META={
  1:{k:'采集',cls:'t1'},
  2:{k:'怪物掉落',cls:'t2'},
  3:{k:'战利品',cls:'t3'},
  4:{k:'挖矿',cls:'t4'}
};

/* ---------- 索引 ---------- */
const madeBy=new Map(), usedIn=new Map();
R.forEach((r,i)=>{
  if(!madeBy.has(r.o)) madeBy.set(r.o,[]);
  madeBy.get(r.o).push(i);
  r.in.forEach(([ii])=>{
    if(!usedIn.has(ii)) usedIn.set(ii,[]);
    usedIn.get(ii).push(i);
  });
});
IT.forEach(it=>{ it.h=(it[1]+' '+it[2]+' '+it[3]+' '+it[0]+' '+it[5]+' '+(SR[it[9]]||'')).toLowerCase(); });
R.forEach(r=>{
  let s=IT[r.o].h+' '+r.s.map(x=>ST[x]).join(' ');
  r.in.forEach(([ii])=>{ s+=' '+IT[ii].h; });
  r._h=s;
});
/* 物品获取摘要 */
const ACQIDX={};
for(const k in ACQ){ ACQIDX[k]=ACQ[k]; }
function acqOf(i){ return ACQIDX[i]||null; }
function acqSummary(i){
  const a=acqOf(i); if(!a) return null;
  const c={};
  a.forEach(([t])=>{ c[t]=(c[t]||0)+1; });
  return c;
}

/* ---------- 无配方数据物品 ---------- */
/* 既不能合成、也没有任何获取途径（多为模组残留、纯背景墙变体），单独成类，默认不参与常规浏览 */
const NO_DATA=new Set();
IT.forEach((it,i)=>{ if(!acqOf(i) && !madeBy.has(i)) NO_DATA.add(i); });
const DATA_IDX=[], DATA_ITEMS=[];
IT.forEach((it,i)=>{ if(!NO_DATA.has(i)){ DATA_IDX.push(i); DATA_ITEMS.push(it); } });

/* ---------- 状态 ---------- */
const state={q:'',mode:'recipe',st:new Set(),cat:new Set(),rar:new Set(),src:new Set(),acq:new Set(),sort:'name',view:'card',page:'items'};

/* ---------- 计数 ---------- */
function countBy(list,keyf){
  const m={};
  list.forEach(x=>{ keyf(x).forEach(k=>{ m[k]=(m[k]||0)+1; }); });
  return m;
}
const stCountR=countBy(R,r=>r.s), catCountR=countBy(R,r=>r.c), srcCountR=countBy(R,r=>[r.src]);
const catCountI=countBy(DATA_ITEMS,it=>[it[5]]), srcCountI=countBy(DATA_ITEMS,it=>[it[9]]);
const acqCountI={};
for(const k in ACQ){ ACQ[k].forEach(([t])=>{ acqCountI[t]=(acqCountI[t]||0)+1; }); }
const onlyCraft = IT.filter((it,i)=>!acqOf(i) && madeBy.has(i)).length;
const RAR_ORDER=['common','uncommon','rare','legendary','essential','none'];
function rarCounts(){
  const m={};
  if(state.mode==='recipe') R.forEach(r=>{ const k=rarOf(r.o)||'none'; m[k]=(m[k]||0)+1; });
  else DATA_IDX.forEach(i=>{ const k=rarOf(i)||'none'; m[k]=(m[k]||0)+1; });
  return m;
}

/* ---------- 筛选器定义 ---------- */
const FILTERS={
  st:{label:'制作站', getOptions:()=>ST.map((s,i)=>[String(i),s,stCountR[i]||0]).filter(x=>x[2]>0)
        .sort((a,b)=>b[2]-a[2]), show:()=>state.mode==='recipe',
      has:(r,v)=>r.s.indexOf(+v)>=0},
  cat:{label:'分类', getOptions:()=>{
        const list=CA.map((s,i)=>[String(i),s,state.mode==='recipe'?(catCountR[i]||0):(catCountI[s]||0)])
          .filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
        if(state.mode==='item' && NO_DATA.size) list.push(['none','无配方数据',NO_DATA.size]);
        return list;
      },
      has:(r,v)=>r.c.indexOf(+v)>=0},
  rar:{label:'稀有度', dot:v=>v==='none'?'var(--line)':`var(--r-${v})`,
      getOptions:()=>{ const m=rarCounts(); return RAR_ORDER.map(k=>[k, k==='none'?'无标注':RAR[k], m[k]||0]).filter(x=>x[2]>0); }},
  src:{label:'来源', getOptions:()=>SR.map((s,i)=>[String(i),s,state.mode==='recipe'?(srcCountR[i]||0):(srcCountI[i]||0)])
        .filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]),
      has:(r,v)=>r.src===+v},
  acq:{label:'获取方式', getOptions:()=>[['1','采集',acqCountI[1]||0],['2','怪物掉落',acqCountI[2]||0],
        ['3','战利品/宝箱',acqCountI[3]||0],['4','挖矿',acqCountI[4]||0],['0','仅可合成',onlyCraft]],
      show:()=>state.mode==='item', hasAny:(it,v)=>hasAcq(it,+v)}
};
function hasAcq(it,v){
  const a=acqOf(it); 
  if(v===0) return !a && madeBy.has(it);
  if(!a) return false;
  return a.some(([t])=>t===v);
}

/* ---------- 筛选 UI ---------- */
const fBox=$('#filters');
const popEls={};
function buildFilters(){
  fBox.innerHTML='';
  Object.keys(FILTERS).forEach(k=>{
    const f=FILTERS[k];
    const wrap=document.createElement('div'); wrap.className='fwrap';
    const btn=document.createElement('button'); btn.className='fbtn'; btn.dataset.k=k;
    btn.innerHTML=`<span class="lb">${f.label}</span><span class="car">▾</span>`;
    const pop=document.createElement('div'); pop.className='pop';
    pop.innerHTML=`<div class="ph"><input type="search" placeholder="筛选 ${f.label}…"></div>
      <div class="plist"></div>
      <div class="pf"><button data-a="all">全选</button><button data-a="none">清空</button>
      <span class="pc" style="margin-left:auto"></span></div>`;
    wrap.appendChild(btn); wrap.appendChild(pop); fBox.appendChild(wrap);
    popEls[k]=pop;

    btn.onclick=e=>{ e.stopPropagation(); togglePop(k); };
    pop.onclick=e=>e.stopPropagation();
    const inp=pop.querySelector('input');
    inp.oninput=()=>fillPop(k,inp.value.trim().toLowerCase());
    inp.onkeydown=e=>{ if(e.key==='Escape'){ closePops(); } };
    pop.querySelector('[data-a=all]').onclick=()=>{
      FILTERS[k].getOptions().forEach(([v])=>{ if(k!=='acq'||v!=='0') state[k].add(v); });
      syncPop(k); render(true); updateFilterBtns();
    };
    pop.querySelector('[data-a=none]').onclick=()=>{ state[k].clear(); syncPop(k); render(true); updateFilterBtns(); };
  });
  const ca=document.createElement('button'); ca.className='clearall'; ca.textContent='清除全部筛选';
  ca.onclick=()=>{ state.st.clear(); state.cat.clear(); state.rar.clear(); state.src.clear(); state.acq.clear(); refreshPops(); updateFilterBtns(); render(true); };
  fBox.appendChild(ca);
  updateFilterBtns();
}
function fillPop(k,q){
  const f=FILTERS[k], pop=popEls[k], listEl=pop.querySelector('.plist');
  let opts=f.getOptions();
  if(q) opts=opts.filter(o=>o[1].toLowerCase().indexOf(q)>=0);
  pop.querySelector('.pc').textContent=`${opts.length} 项`;
  listEl.innerHTML=opts.map(([v,label,c])=>{
    const on=state[k].has(v);
    const dot=f.dot?`<i class="dot" style="background:${f.dot(v)}"></i>`:'';
    return `<label class="opt"><input type="checkbox" data-v="${esc(v)}" ${on?'checked':''}>${dot}
      <span class="t">${esc(label)}</span><span class="c">${c||''}</span></label>`;
  }).join('')||'<div class="none">无匹配项</div>';
  listEl.querySelectorAll('input').forEach(cb=>{
    cb.onchange=()=>{
      const v=cb.dataset.v;
      if(cb.checked) state[k].add(v); else state[k].delete(v);
      if(k==='acq'&&v==='0'&&cb.checked){ state.acq.delete('1');state.acq.delete('2');state.acq.delete('3');state.acq.delete('4');
        listEl.querySelectorAll('input').forEach(x=>{ if(x.dataset.v!=='0') x.checked=false; }); }
      updateFilterBtns(); render(true);
    };
  });
}
function syncPop(k){ const inp=popEls[k].querySelector('input'); fillPop(k, inp.value.trim().toLowerCase()); }
function refreshPops(){ Object.keys(popEls).forEach(k=>{ const i=popEls[k].querySelector('input'); i.value=''; fillPop(k,''); }); }
function togglePop(k){
  const on=popEls[k].classList.contains('on');
  closePops();
  if(!on){ fillPop(k, popEls[k].querySelector('input').value.trim().toLowerCase()); popEls[k].classList.add('on'); }
}
function closePops(){ Object.values(popEls).forEach(p=>p.classList.remove('on')); }
document.addEventListener('click',()=>closePops());

function updateFilterBtns(){
  document.querySelectorAll('.fbtn').forEach(b=>{
    const k=b.dataset.k;
    const n=state[k].size;
    b.classList.toggle('on', n>0);
    b.querySelector('.n')?.remove();
    if(n>0){ const s=document.createElement('span'); s.className='n'; s.textContent=n; b.appendChild(s); }
    b.style.display=FILTERS[k].show && !FILTERS[k].show() ? 'none' : '';
  });
  // 已选 chips
  const box=$('#active'); box.innerHTML='';
  Object.keys(FILTERS).forEach(k=>{
    if(FILTERS[k].show && !FILTERS[k].show()) return;
    const opts=new Map(FILTERS[k].getOptions().map(o=>[o[0],o[1]]));
    state[k].forEach(v=>{
      const el=document.createElement('span'); el.className='achip';
      el.innerHTML=`${esc(FILTERS[k].label)}：${esc(opts.get(v)||v)} <span style="opacity:.6">×</span>`;
      el.onclick=()=>{ state[k].delete(v); syncPop(k); updateFilterBtns(); render(true); };
      box.appendChild(el);
    });
  });
}

/* ---------- 数据筛选 ---------- */
function curList(){
  const q=state.q.trim().toLowerCase();
  const toks=q?q.split(/\s+/):null;
  if(state.mode==='recipe'){
    return R.map((r,i)=>i).filter(i=>{
      const r=R[i];
      if(state.st.size && !r.s.some(x=>state.st.has(String(x)))) return false;
      if(state.cat.size && !r.c.some(x=>state.cat.has(String(x)))) return false;
      if(state.rar.size && !state.rar.has(rarOf(r.o)||'none')) return false;
      if(state.src.size && !state.src.has(String(r.src))) return false;
      if(toks){ for(const t of toks) if(r._h.indexOf(t)<0) return false; }
      return true;
    });
  }
  return IT.map((it,i)=>i).filter(i=>{
    const it=IT[i];
    if(state.cat.size){
      const cv=NO_DATA.has(i)?'none':String(CA.indexOf(it[5]));
      if(!state.cat.has(cv)) return false;
    }else if(NO_DATA.has(i) && !toks) return false;   // 默认隐藏无配方数据的物品，搜索时例外
    if(state.rar.size && !state.rar.has(rarOf(i)||'none')) return false;
    if(state.src.size && !state.src.has(String(it[9]))) return false;
    if(state.acq.size){
      let ok=false;
      for(const v of state.acq){ if(hasAcq(i,+v)){ ok=true; break; } }
      if(!ok) return false;
    }
    if(toks){ for(const t of toks) if(it.h.indexOf(t)<0) return false; }
    return true;
  });
}
function sortList(ids){
  const s=state.sort;
  const keyRecipe=i=>{
    const r=R[i];
    if(s==='station') return (ST[r.s[0]]||'')+'|'+IT[r.o][1];
    if(s==='ings') return String(1000+r.in.length)+'|'+IT[r.o][1];
    if(s==='count') return String(10000+r.in.reduce((a,c)=>a+c[1],0))+'|'+IT[r.o][1];
    return IT[r.o][1];
  };
  if(state.mode==='recipe') return ids.slice().sort((a,b)=>keyRecipe(a).localeCompare(keyRecipe(b),'zh'));
  if(s==='cat') return ids.slice().sort((a,b)=>{
    const x=IT[a][5], y=IT[b][5];
    return x===y?IT[a][1].localeCompare(IT[b][1],'zh'):x.localeCompare(y,'zh');
  });
  if(s==='src') return ids.slice().sort((a,b)=>{
    const x=SR[IT[a][9]]||'', y=SR[IT[b][9]]||'';
    return x===y?IT[a][1].localeCompare(IT[b][1],'zh'):x.localeCompare(y,'zh');
  });
  return ids.slice().sort((a,b)=>IT[a][1].localeCompare(IT[b][1],'zh'));
}
function updateSortOptions(){
  const sel=$('#sort');
  const opts=state.mode==='recipe'
    ? [['name','按名称'],['station','按制作站'],['ings','按材料种类'],['count','按材料总量']]
    : [['name','按名称'],['cat','按分类'],['src','按来源']];
  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(!opts.some(o=>o[0]===state.sort)) state.sort='name';
  sel.value=state.sort;
}

/* ---------- 渲染 ---------- */
const list=$('#list'), moreWrap=$('#morewrap'), countEl=$('#count');
let CURRENT=[], SHOWN=0, RE=null;
const PAGE=120;

function iconHTML(i){
  const it=IT[i], r=rarOf(i), ra=r?` data-r="${r}"`:'';
  if(it[8]>=0 && IC[it[8]]) return `<img src="data:image/png;base64,${IC[it[8]]}" alt="" loading="lazy"${ra}>`;
  const col=PALETTE[ihash(it[1])%PALETTE.length];
  return `<span class="ph"${ra} style="background:${col}1f;color:${col}">${esc((it[1]||'?').slice(0,1))}</span>`;
}
function hl(text,re){ const e=esc(text); return re?e.replace(re,m=>'<mark>'+m+'</mark>'):e; }
function curRegex(q){
  const toks=q.split(/\s+/).filter(Boolean).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!toks.length) return null;
  try{ return new RegExp('('+toks.join('|')+')','gi'); }catch(e){ return null; }
}
function ingChips(r,re){
  return r.in.map(([ii,c])=>`<span class="ing" data-i="${ii}" title="${esc(IT[ii][1])}">${iconHTML(ii)}<span class="nm">${hl(IT[ii][1],re)}</span><em>×${c}</em></span>`).join('');
}
function cardRecipe(i,re){
  const r=R[i], it=IT[r.o], rr=rarOf(r.o);
  const sub=[it[5],...r.s.map(x=>ST[x])].filter(Boolean).join(' · ');

  return `<article class="card" data-i="${r.o}" data-ri="${i}"${rr?` data-r="${rr}"`:''}>

function cardItem(i,re){
  const it=IT[i];
  const a=acqSummary(i), made=madeBy.has(i);

  if(made) badges+=`<span class="ab t0">可合成${madeBy.get(i).length>1?' '+madeBy.get(i).length:''}</span>`;

    [1,2,3,4].forEach(t=>{ if(a[t]) badges+=`<span class="ab ${ACQ_META[t].cls}">${ACQ_META[t].k} ${a[t]}</span>`; });
  }

      <div class="abadges">${badges}</div>
    </div></article>`;
}
function renderList(){
  const ids=CURRENT.slice(SHOWN, SHOWN+PAGE);
  SHOWN+=ids.length;
  if(state.view==='table'){
    const head=state.mode==='recipe'
      ? '<tr><th style="width:230px">产物</th><th style="width:52px">数量</th><th>所需材料</th><th style="width:170px">制作站</th></tr>'
      : '<tr><th style="width:250px">物品</th><th style="width:110px">分类</th><th>获取方式</th></tr>';
    let tb=document.getElementById('tblBody');
    if(!tb){
      list.innerHTML=`<table class="tbl"><thead>${head}</thead><tbody id="tblBody"></tbody></table>`;
      tb=document.getElementById('tblBody');
    }
    const rows=ids.map(i=>{
      if(state.mode==='recipe'){
        const r=R[i], it=IT[r.o];
        return `<tr data-i="${r.o}"><td><div class="pname">${iconHTML(r.o)}<span>${hl(it[1],RE)}</span></div></td>
          <td class="pq">${(r.n>1||typeof r.n==='string')?'×'+r.n:''}</td>
          <td><div class="pings">${ingChips(r,RE)}</div></td>
          <td class="pstation">${esc(r.s.map(x=>ST[x]).join(' / '))}</td></tr>`;
      }
      const it=IT[i], a=acqSummary(i);
      const b=[]; if(madeBy.has(i)) b.push('合成'); if(a){[1,2,3,4].forEach(t=>{if(a[t])b.push(ACQ_META[t].k)});}
      return `<tr data-i="${i}"><td><div class="pname">${iconHTML(i)}<span>${hl(it[1],RE)}</span></div></td>
        <td>${esc(it[5])}</td><td class="pstation" style="max-width:none">${esc(b.join(' / ')||'—')}</td></tr>`;
    }).join('');
    tb.insertAdjacentHTML('beforeend',rows);
  }else{
    const html=ids.map(i=>state.mode==='recipe'?cardRecipe(i,RE):cardItem(i,RE)).join('');
    list.insertAdjacentHTML('beforeend',html);
  }
  moreWrap.innerHTML = SHOWN<CURRENT.length
    ? `<button id="more">加载更多（还有 ${CURRENT.length-SHOWN} 条）</button>` : '';
  const mb=$('#more'); if(mb) mb.onclick=()=>renderList();
}
function render(reset){
  const t0=performance.now();
  if(reset){
    CURRENT=sortList(curList());
    SHOWN=0; list.innerHTML=''; list.className=state.view==='table'?'':'grid';
    RE=curRegex(state.q.trim());
    countEl.innerHTML=`共 <b>${CURRENT.length}</b> ${state.mode==='recipe'?'条配方':'件物品'}` +
      (CURRENT.length!==(state.mode==='recipe'?R.length:IT.length)?` / 全部 ${state.mode==='recipe'?R.length:IT.length}`:'');
    if(state.mode==='item' && !state.cat.has('none') && !state.q.trim() && NO_DATA.size)
      countEl.innerHTML+=`<span class="hidtip">已隐藏 ${NO_DATA.size} 件无配方数据 · 可在「分类」中查看</span>`;
    if(!CURRENT.length){
      list.className='';
      list.innerHTML=`<div class="empty"><div class="big">🔍</div>没有匹配结果${state.q?`：<b>${esc(state.q)}</b>`:''}<br>
        <span style="font-size:12.5px">试试更短的关键词，或清除筛选条件</span></div>`;
      moreWrap.innerHTML=''; return;
    }
  }
  renderList();
  // 事件委托
  if(reset){
    list.onclick=e=>{
      const ing=e.target.closest('.ing');
      if(ing){ e.stopPropagation(); openDrawer(+ing.dataset.i); return; }
      const card=e.target.closest('[data-i]');
      if(card) openDrawer(+card.dataset.i);
    };
  }
}

/* ---------- 星球与矿产 ---------- */
const pstate={q:'',src:-1,t:0,shown:0};
const PAGE_P=24;
const pgrid=$('#pgrid'), pcount=$('#pcount');

function thrLabel(p){
  const [a,b]=p.threat||[0,0];
  if(a===b) return `威胁 ${a} · ${THR_NAME[a-1]||''}`.trim();
  return `威胁 ${a}–${b}`;
}
function planetCard(p){
  const nm=p.biomes.slice(0,4).map(esc).join(' · ');
  const biomes = p.biomes.length
    ? nm + (p.nBiomes>4?` <span style="opacity:.7">等 ${p.nBiomes} 个群系</span>`:'')
    : '—';
  const oreSet=new Set();
  (p.layers||[]).forEach(([g,ores])=>ores.forEach(([id])=>oreSet.add(id)));
  const nOre=oreSet.size;
  const nW=(p.weather||[]).length;
  const env=(p.env||[]).map(e=>e[0]);
  const thumb = (p.icon>=0 && PIC[p.icon])
    ? `<img src="data:image/png;base64,${PIC[p.icon]}" alt="">`
    : `<span class="pball" data-t="${p.threat[0]}">${p.threat[0]}</span>`;
  return `<article class="pcard" data-pid="${esc(p.id)}">
    <div class="pthumb">${thumb}</div>
    <div class="pwrap">
      <div class="phd"><h3>${esc(p.name)}</h3>
        <span class="thr" data-t="${p.threat[0]}">${esc(thrLabel(p))}</span>
        ${p.src?'<span class="psrc">模组</span>':''}
      </div>
      <div class="pbi">群系：${biomes}</div>
      <div class="pstats">
        <span class="pst"><b>${nOre}</b> 种矿</span>
        <span class="pst"><b>${nW}</b> 种天气</span>
        ${env.length?`<span class="pst env">${env.map(esc).join(' · ')}</span>`:''}
      </div>
      <span class="pgo">查看档案 ›</span>
    </div>
  </article>`;
}
function planetList(){
  const q=pstate.q.trim().toLowerCase();
  return PL.filter(p=>{
    if(pstate.src>=0 && p.src!==pstate.src) return false;
    if(pstate.t && !(pstate.t>=p.threat[0] && pstate.t<=p.threat[1])) return false;
    if(!q) return true;
    if(p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) return true;
    if((p.biomes||[]).some(b=>b.toLowerCase().includes(q))) return true;
    return (p.layers||[]).some(([g,ores])=>ores.some(o=>o[1].toLowerCase().includes(q)));
  }).sort((a,b)=>{
    if(a.threat[0]!==b.threat[0]) return a.threat[0]-b.threat[0];
    if(a.src!==b.src) return a.src-b.src;
    return a.name.localeCompare(b.name,'zh');
  });
}
function renderPlanets(reset){
  if(reset) pstate.shown=0;
  const all=planetList();
  const batch=all.slice(pstate.shown, pstate.shown+PAGE_P);
  pstate.shown+=batch.length;
  if(reset) pgrid.innerHTML=batch.map(planetCard).join('') ||
    `<div class="empty" style="grid-column:1/-1"><div class="big">🪐</div>没有匹配的星球类型</div>`;
  else pgrid.insertAdjacentHTML('beforeend', batch.map(planetCard).join(''));
  pcount.innerHTML=`共 <b>${all.length}</b> 种星球类型 · 矿产取该等级可出现的上限`;
  let more=document.getElementById('pmore');
  if(pstate.shown<all.length){
    if(!more){
      more=document.createElement('button'); more.id='pmore'; more.className='morep';
      more.onclick=()=>renderPlanets(false); pgrid.after(more);
    }
    more.textContent=`加载更多（还有 ${all.length-pstate.shown} 种）`;
  }else if(more) more.remove();
}
function buildPlanetTabs(){
  const box=$('#ptabs');
  const srcs=[['-1','全部来源'],['0','本体'],['1','模组']];
  const tc={};
  PL.forEach(p=>{ for(let i=p.threat[0];i<=p.threat[1];i++) tc[i]=(tc[i]||0)+1; });
  const maxT=Math.max(...PL.map(p=>p.threat[1]),1);
  let tiers=`<button class="pchip${pstate.t===0?' on':''}" data-t="0">全部等级</button>`;
  for(let i=1;i<=maxT;i++){
    tiers+=`<button class="pchip${pstate.t===i?' on':''}" data-t="${i}"
      title="${THR_NAME[i-1]||''} · ${tc[i]||0} 种星球">${i} 级${tc[i]?` <span class="tc">${tc[i]}</span>`:''}</button>`;
  }
  box.innerHTML=srcs.map(([v,l])=>`<button class="pchip${pstate.src===+v?' on':''}" data-src="${v}">${l}</button>`).join('')+tiers;
  box.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
    pstate.src=+b.dataset.src; buildPlanetTabs(); renderPlanets(true);
  });
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    pstate.t=+b.dataset.t; buildPlanetTabs(); renderPlanets(true);
  });
}
let curP=null, pExpand={mob:false,biome:false}, curLv=0;
function chipList(items, limit, key){
  const shown=pExpand[key]?items:items.slice(0,limit);
  let html=shown.map(x=>Array.isArray(x)
    ? `<span class="bchip">${esc(x[0])}<i>${x[1]}%</i></span>`
    : `<span class="bchip">${esc(x)}</span>`).join('');
  if(items.length>limit){
    html+=pExpand[key]
      ? `<button class="pmor" data-exp="${key}">收起</button>`
      : `<button class="pmor" data-exp="${key}">+${items.length-limit}</button>`;
  }
  return html;
}
function openPlanet(p, keep){
  curP=p;
  if(!keep) pExpand={mob:false,biome:false};
  const [t0,t1]=p.threat||[0,0];
  di.innerHTML = (p.icon>=0 && PIC[p.icon])
    ? `<img src="data:image/png;base64,${PIC[p.icon]}" alt="">`
    : `<span class="pball" data-t="${t0}">${t0}</span>`;
  delete di.dataset.r;   // 清掉上一条物品的稀有度外圈
  dn.textContent=p.name;
  did.textContent=p.id;
  db.innerHTML=[
    `<span class="badge">威胁 ${t0}${t1!==t0?'–'+t1:''}</span>`,
    `<span class="badge">${p.src?'模组':'本体'}</span>`,
    `<span class="badge">${p.nBiomes} 个群系</span>`
  ].join('');

  let h='';

  /* 推荐防护 */
  if((p.env||[]).length){
    h+=`<div class="dsec psec"><h4>需要防护</h4><div class="envline">${
      p.env.map(([zh,hint])=>`<span class="etag">${esc(zh)}<i>${esc(hint)}</i></span>`).join('')}</div></div>`;
  }

  /* 矿产：按等级解锁（u = 最早出现的等级），各层合并去重，并记录来源 */
  const oMap=new Map();
  (p.layers||[]).forEach(([g,ores])=>ores.forEach(([id,name,u])=>{
    let o=oMap.get(id);
    if(!o){ o={name,u,planet:false,space:false}; oMap.set(id,o); }
    else if(u<o.u) o.u=u;
    if(g==='太空') o.space=true; else o.planet=true;   // 核心层也算星球本体
  }));

  /* 等级切换：矿产只在有解锁变化的区间内才值得切换 */
  const maxU=Math.max(t0, ...[...oMap.values()].map(o=>o.u));   // 矿脉配置最高档位
  const hi=Math.min(t1, maxU);
  if(!keep){ pExpand={mob:false,biome:false}; curLv=hi; }
  curLv=Math.max(t0, Math.min(curLv, hi));
  if(hi>t0){
    const cntAt=L=>{ let n=0; oMap.forEach(o=>{ if(o.u<=L) n++; }); return n; };
    h+=`<div class="dsec psec"><h4>按等级查看</h4><div class="lvbar">`;
    for(let L=t0;L<=hi;L++)
      h+=`<button class="lvb${L===curLv?' on':''}" data-lv="${L}">${L} 级<i>${cntAt(L)}</i></button>`;
    h+=`</div><div class="lvn">该类型在 ${t0}–${t1} 级都会出现${hi<t1?`，矿产在 ${hi} 级后不再增加`:''}；下面是 ${curLv} 级的情况。</div></div>`;
  }else if(t1>t0){
    h+=`<div class="dsec psec"><h4>按等级查看</h4><div class="lvn">该类型在 ${t0}–${t1} 级都会出现，但矿产在 ${t0} 级已达到矿脉配置的上限，各等级完全相同。</div></div>`;
  }

  const shown=[...oMap.entries()].filter(([,o])=>o.u<=curLv);
  const onPlanet=shown.filter(([,o])=>o.planet);        // 地表 / 浅层 / 地下 / 核心
  const inOrbit=shown.filter(([,o])=>!o.planet);        // 仅存在于太空小行星
  const chip=([id,o])=>{
    const r=rarOf(id);
    return `<span class="och"${r?` data-r="${r}"`:''}>${esc(o.name)}</span>`;
  };
  const rset=new Set(shown.map(([id])=>rarOf(id)||'none'));
  h+=`<div class="dsec psec"><h4>矿产 · ${shown.length}</h4>`;
  if(!shown.length){
    h+=`<div class="none">该等级下不生成矿脉。</div>`;
  }else{
    h+=`<div class="mgroup"><div class="mghead">星球 · 地表 / 地下 / 核心<em>${onPlanet.length}</em></div>`;
    h+= onPlanet.length
      ? `<div class="pbl">${onPlanet.map(chip).join('')}</div>`
      : `<div class="none">该类型在地表、地下与核心层都不生成矿脉，矿物只能从轨道小行星获取。</div>`;
    h+=`</div>`;
    if(inOrbit.length){
      h+=`<div class="mgroup"><div class="mghead">轨道 · 太空小行星带<em>${inOrbit.length}</em></div>`;
      h+=`<div class="pbl">${inOrbit.map(chip).join('')}</div></div>`;
    }
    const order=RAR_ORDER.filter(k=>k!=='none'&&rset.has(k));
    if(order.length) h+=`<div class="rarleg">${order.map(k=>
      `<span data-r="${k}">${esc(RAR[k])}</span>`).join('')}</div>`;
  }
  h+=`</div>`;

  /* 地心 */

    ? `<div class="pbl">${p.core.map(n=>`<span class="bchip">${esc(n)}</span>`).join('')}</div>`
    : `<div class="none">该类型没有核心层。</div>`;

    : `<div class="none">几乎没有天气变化。</div>`;
  h+=`</div>`;

  /* 群系 */
  h+=`<div class="dsec psec"><h4>群系 · ${(p.biomes||[]).length}</h4><div class="pbl">${
    chipList(p.biomes||[], 14, 'biome') || '<span class="none">无</span>'}</div></div>`;

  h+=`<div class="pfoot">「星球」组来自地表、浅层、地下与核心层，落地即可开采；「轨道」组只存在于太空的小行星带，需要飞到轨道上敲。颜色代表矿物稀有度，等级依据矿脉配置的档位换算。</div>`;

  dbody.innerHTML=h;
  dbody.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.exp;
    pExpand[k]=!pExpand[k];

  dbody.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{
    curLv=+b.dataset.lv;
    openPlanet(curP, true);
  });
  dbody.scrollTop=0;
  drawer.classList.add('on'); backdrop.classList.add('on');
  drawer.setAttribute('aria-hidden','false');
}
/* ---------- 怪物图鉴 ---------- */
const mstate={q:'',cat:'',shown:0};
const PAGE_M=48;
const mgrid=$('#mgrid'), mcount=$('#mcount');

function monCard(m){
  const [id,name,cat,hp,drops,planets]=m;
  const label=MCAT[cat]||cat;
  const col=PALETTE[ihash(name||id)%PALETTE.length];
  return `<article class="pcard" data-mid="${esc(id)}">
    <div class="pthumb"><span class="mchar" style="background:${col}22;color:${col}">${esc((name||'?').slice(0,1))}</span></div>
    <div class="pwrap">
      <div class="phd"><h3>${esc(name)}</h3><span class="psrc">${esc(label)}</span></div>
      <div class="pstats">
        ${hp?`<span class="pst"><b class="mhp">${hp}</b> 生命</span>`:''}
        <span class="pst"><b>${drops.length}</b> 掉落</span>
        <span class="pst"><b>${planets.length}</b> 星球</span>
      </div>
      <span class="pgo">查看档案 ›</span>
    </div>
  </article>`;
}
function monList(){
  const q=mstate.q.trim().toLowerCase();
  const none=mstate.cat==='__none';
  return MON.filter(m=>{
    const hasP=m[5].length>0;
    if(none){ if(hasP) return false; }
    else{
      if(!hasP) return false;                       // 常规视图不混入无星球怪物
      if(mstate.cat && m[2]!==mstate.cat) return false;
    }
    if(!q) return true;
    return (m[1]||'').toLowerCase().includes(q) || m[0].toLowerCase().includes(q);
  }).sort((a,b)=>{
    const w=x=>x[5].length*10+x[4].length;
    if(w(a)!==w(b)) return w(b)-w(a);
    return String(a[1]).localeCompare(String(b[1]),'zh');
  });
}
function renderMonsters(reset){
  if(reset) mstate.shown=0;
  const all=monList();
  const batch=all.slice(mstate.shown, mstate.shown+PAGE_M);
  mstate.shown+=batch.length;
  if(reset) mgrid.innerHTML=batch.map(monCard).join('') ||
    `<div class="empty" style="grid-column:1/-1"><div class="big">👾</div>没有匹配的怪物</div>`;
  else mgrid.insertAdjacentHTML('beforeend', batch.map(monCard).join(''));
  const nNo=MON.filter(x=>x[5].length===0).length;
  mcount.innerHTML=`共 <b>${all.length}</b> 种怪物` +
    (mstate.cat!=='__none' && nNo ? ` · 另有 <b>${nNo}</b> 种未在星球生成` : '');
  let more=document.getElementById('mmore');
  if(mstate.shown<all.length){
    if(!more){
      more=document.createElement('button'); more.id='mmore'; more.className='morep';
      more.onclick=()=>renderMonsters(false); mgrid.after(more);
    }
    more.textContent=`加载更多（还有 ${all.length-mstate.shown} 种）`;
  }else if(more) more.remove();
}
function buildMonsterTabs(){
  const c={}; let nNo=0;
  MON.forEach(m=>{ if(m[5].length) c[m[2]]=(c[m[2]]||0)+1; else nNo++; });
  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const nP=MON.length-nNo;
  $('#mtabs').innerHTML=
    `<button class="pchip${mstate.cat===''?' on':''}" data-cat="">全部 ${nP}</button>`+
    list.map(([k,n])=>`<button class="pchip${mstate.cat===k?' on':''}" data-cat="${esc(k)}">${esc(MCAT[k]||k)} ${n}</button>`).join('')+
    (nNo?`<button class="pchip${mstate.cat==='__none'?' on':''}" data-cat="__none">未在星球生成 ${nNo}</button>`:'');
  $('#mtabs').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    mstate.cat=b.dataset.cat; buildMonsterTabs(); renderMonsters(true);

}
function openMonster(m){
  const [id,name,cat,hp,drops,planets]=m;
  di.innerHTML=`<span class="mchar" style="background:${PALETTE[ihash(name)%PALETTE.length]}22;color:${PALETTE[ihash(name)%PALETTE.length]}">${esc((name||'?').slice(0,1))}</span>`;

  }).join('')}</div>`;

  else h+=`<div class="pbl">${planets.map(pid=>{
    const p=PL.find(x=>x.id===pid);
    return `<span class="bchip" data-mpid="${esc(pid)}" style="cursor:pointer">${esc(p?p.name:pid)}</span>`;
  }).join('')}</div>`;
  h+=`</div>`;

  h+=`<div class="pfoot">掉落来自 monstertype 的 dropPools（含嵌套池展开）；生成星球取自各群系的 spawnProfile。</div>`;

const drawer=$('#drawer'), backdrop=$('#backdrop');
const di=$('#di'), dn=$('#dn'), did=$('#did'), db=$('#db'), dbody=$('#dbody');
let acqExpanded=false;

function openDrawer(i){
  const it=IT[i], rr=rarOf(i);
  di.innerHTML=iconHTML(i);
  if(rr) di.dataset.r=rr; else delete di.dataset.r;
  dn.textContent=it[1];
  did.textContent=it[0];
  const b=[];
  if(it[5]) b.push(`<span class="badge">${esc(it[5])}</span>`);
  if(rr) b.push(`<span class="badge r-${rr}">${RAR[rr]}</span>`);
  if(it[7]) b.push(`<span class="badge">${it[7]} 像素</span>`);
  if(SR[it[9]]&&SR[it[9]]!=='本体') b.push(`<span class="badge">${esc(SR[it[9]])}</span>`);
  db.innerHTML=b.join('');

  let h='';
  if(it[4]) h+=`<div class="dsec"><div class="desc">${esc(it[4])}</div></div>`;

  /* 矿物产地 */
  const os_=OS[i];
  if(os_&&os_.length){
    const LN={1:'地表',2:'地下',3:'核心层',4:'太空 / 小行星',5:'大气',6:'特殊天体'};
    let rows='';
    os_.forEach(g=>{
      const [lay,t0,t1,cnt,names]=g;
      const lv=`${Math.round(t0+0.5)}–${Math.round(t1+0.5)} 级`;
      const nm=names.slice(0,6).join('、')+(cnt>6?` 等 ${cnt} 个`:`（${cnt} 个）`);
      rows+=`<div class="acrow"><span class="k t0" style="color:var(--accent);background:var(--accent-soft)">${LN[lay]||'其他'}</span>
        <span class="v"><b>${lv}</b> · ${nm}</span></div>`;
    });
    h+=`<div class="dsec"><h4>矿物产地</h4><div class="acq">${rows}</div></div>`;
  }

  /* 计算机研究 */
  const rv=RS[i];
  if(rv&&rv[0]){
    const q=rv[1]>1?`<b>${rv[1]}</b> 个`:'1 个';
    const p=rv[1]>1?`<b>1</b> 点`:`<b>${rv[0]}</b> 点${rv[0]<3?'（约）':''}`;
    h+=`<div class="dsec"><h4>计算机研究</h4><div class="acq">
      <div class="acrow"><span class="k t0" style="color:var(--blue);background:var(--blue-soft)">研究点数</span>
      <span class="v">${q} → ${p}</span></div>
      <div class="acrow"><span class="k t0" style="color:var(--mut);background:var(--bg2)">机器</span>
      <span class="v" style="color:var(--mut)">基础计算机 10 秒 / 个人计算机 2 秒 / 高级计算机 1.5 秒 / 研究服务器 1 秒（每件 5% 折算，倍率相同）</span></div>
    </div></div>`;
  }

  /* 获取途径 */
  const a=acqOf(i), made=madeBy.get(i)||[];
  h+=`<div class="dsec"><h4>获取途径</h4><div class="acq">`;
  if(made.length){
    h+=`<div class="acrow"><span class="k t0" style="color:var(--blue);background:var(--blue-soft)">合成</span>
      <span class="v"><b>${made.length}</b> 种配方，需在 ${esc([...new Set(made.flatMap(ri=>R[ri].s.map(x=>ST[x])))].join(' / '))} 制作</span></div>`;
  }
  if(a){
    const groups={};
    a.forEach(([t,l])=>{ (groups[t]=groups[t]||[]).push(ACL[l]); });
    [1,2,3,4].forEach(t=>{
      if(!groups[t]) return;
      const arr=groups[t];
      const show=acqExpanded?arr:arr.slice(0,6);
      const rest=arr.length-show.length;
      h+=`<div class="acrow"><span class="k ${ACQ_META[t].cls==='t1'?'t1':''}" style="${
        t===1?'color:var(--green);background:var(--green-soft)':t===2?'color:var(--accent);background:var(--accent-soft)':
        t===3?'color:var(--purple);background:var(--purple-soft)':'color:#8a7a2f;background:#f7f3df'}">${ACQ_META[t].k}</span>
        <span class="v">${show.map(x=>esc(x)).join(t===2?'、':'；')}${rest>0?` <button class="more-btn" data-more="1">+${rest}</button>`:''}</span></div>`;
    });
  }
  if(!made.length && !a){
    h+=`<div class="none">没有静态配方，也不是常规采集/掉落物（可能来自任务、交易或代码生成）。</div>`;
  }
  h+=`</div></div>`;

  /* 合成配方 */
  h+=`<div class="dsec"><h4>合成配方${made.length?' · '+made.length+' 种':''}</h4>`;
  if(!made.length) h+=`<div class="none">该物品没有配方产出。</div>`;
  else{
    made.forEach(ri=>{
      const r=R[ri];
      const prob=/^(常见|少见|稀有|极稀有)$/.test(r.p||'');
      const pb=r.p?`<span class="st" style="margin-left:8px;color:var(--mut);font-weight:400">${prob?'概率：':''}${esc(r.p)}</span>`:'';
      const nx=r.x?`<div class="ings" style="margin-top:2px"><span class="nm" style="font-size:12px;color:var(--mut);padding-right:2px">同时产出</span>${r.x.map(([ii,c])=>`<span class="ing" data-i="${ii}">${iconHTML(ii)}<span class="nm">${esc(IT[ii][1])}</span><em>×${c}</em></span>`).join('')}</div>`:'';
      h+=`<div class="recipe"><div class="top"><span class="st">${esc(r.s.map(x=>ST[x]).join(' / '))}</span>${pb}
        <span class="file" title="${esc(r.f)}">${esc(r.f)}</span></div>
        <div class="ings">${r.in.map(([ii,c])=>`<span class="ing" data-i="${ii}">${iconHTML(ii)}<span class="nm">${esc(IT[ii][1])}</span><em>×${c}</em></span>`).join('')}</div>${nx}</div>`;
    });
  }
  h+=`</div>`;

  /* 用于制作 */
  const uses=usedIn.get(i)||[];
  h+=`<div class="dsec"><h4>用于制作${uses.length?' · '+new Set(uses.map(ri=>R[ri].o)).size+' 种产物':''}</h4>`;
  if(!uses.length) h+=`<div class="none">没有配方需要这件物品。</div>`;
  else{
    const seen=new Set(); h+='<div class="uses">';
    uses.forEach(ri=>{
      const r=R[ri]; if(seen.has(r.o)) return; seen.add(r.o);
      const cnt=r.in.find(x=>x[0]===i)[1];
      h+=`<div class="use" data-o="${r.o}">${iconHTML(r.o)}<span class="t">${esc(IT[r.o][1])}</span><span class="c">需要 ×${cnt}</span></div>`;
    });
    h+='</div>';
  }
  h+=`</div>`;

  dbody.innerHTML=h;
  dbody.querySelectorAll('.ing').forEach(el=>el.onclick=ev=>{ev.stopPropagation(); acqExpanded=false; openDrawer(+el.dataset.i);});
  dbody.querySelectorAll('.use').forEach(el=>el.onclick=()=>{acqExpanded=false; openDrawer(+el.dataset.o);});
  const mb=dbody.querySelector('[data-more]');
  if(mb) mb.onclick=()=>{ acqExpanded=true; openDrawer(i); };
  dbody.scrollTop=0;
  drawer.classList.add('on'); backdrop.classList.add('on');
  drawer.setAttribute('aria-hidden','false');
}

/* 地址栏同步 */
function readHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(!h) return;
  const p=new URLSearchParams(h);
  if(p.get('q')){ state.q=p.get('q'); q.value=state.q; clearBtn.style.display='block'; }
  if(p.get('m')){ state.mode=p.get('m');
    document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x.dataset.m===state.mode)); }
  if(p.get('v')){ state.view=p.get('v');
    document.querySelectorAll('#viewseg button').forEach(x=>x.classList.toggle('on',x.dataset.v===state.view)); }
  ['st','cat','rar','src','acq'].forEach(k=>{ const val=p.get(k); if(val) val.split(',').forEach(x=>state[k].add(x)); });
  if(p.get('sort')){ state.sort=p.get('sort'); $('#sort').value=state.sort; }
  if(p.get('t')==='dark') document.documentElement.dataset.theme='dark';
  if(p.get('o')) setTimeout(()=>openDrawer(+p.get('o')),80);
}
function writeHash(){
  const p=new URLSearchParams();
  if(state.q) p.set('q',state.q);
  if(state.mode!=='recipe') p.set('m',state.mode);
  if(state.view!=='card') p.set('v',state.view);
  if(state.sort!=='name') p.set('sort',state.sort);
  ['st','cat','rar','src','acq'].forEach(k=>{ if(state[k].size) p.set(k,[...state[k]].join(',')); });
  const s=p.toString();
  try{ history.replaceState(null,'',s?'#'+s:location.pathname+location.search); }catch(e){}
}

/* 图标到达后就地替换，不重排列表，避免滚动位置与已加载页数被重置 */
function refreshIcons(){
  document.querySelectorAll('.ph').forEach(el=>{
    let idx;
    const ing=el.closest('.ing');
    if(ing) idx=+ing.dataset.i;
    else{ const card=el.closest('[data-i]'); if(card) idx=+card.dataset.i; }   // 卡片上是物品索引，不是 ID
    if(idx==null || isNaN(idx)) return;
    const it=IT[idx]; if(!it || !(it[8]>=0) || !IC[it[8]]) return;
    const img=document.createElement('img');
    img.src='data:image/png;base64,'+IC[it[8]];
    img.alt=''; img.loading='lazy';
    if(el.dataset.r) img.dataset.r=el.dataset.r;
    el.replaceWith(img);
  });
}
if(!PART.world){
  const g=document.getElementById('pgrid'), m=document.getElementById('mgrid');
  if(g) g.innerHTML='<div class="empty" style="grid-column:1/-1">正在载入星球数据…</div>';
  if(m) m.innerHTML='<div class="empty" style="grid-column:1/-1">正在载入怪物数据…</div>';
}
function applyPart(name){
  PART[name]=true;
  if(name==='icons'){
    IC=D.icons||[]; PIC=D.pIcons||[];
    refreshIcons();
    if(state.page==='planets') renderPlanets(true);
    if(state.page==='monsters') renderMonsters(true);
  }else{
    PL=D.planets||[]; MON=D.monsters||[];
    if(state.page==='planets'){ buildPlanetTabs(); renderPlanets(true); }
    if(state.page==='monsters'){ buildMonsterTabs(); renderMonsters(true); }
  }
}
if(!PART.icons) loadPart('icons','data/icons.js').then(ok=>{ if(ok) applyPart('icons'); });
if(!PART.world) loadPart('world','data/world.js').then(ok=>{ if(ok) applyPart('world'); });
})();
</script>
</body>
</html>
